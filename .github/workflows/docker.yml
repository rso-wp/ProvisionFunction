name: Publish image

# Push a git tag like v1.2.3 to build the image and push it to Docker Hub as armodilo/provisionfunction:v1.2.3.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a token with Read & Write).
on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE: armodilo/provisionfunction

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Function/Dockerfile
          platforms: linux/amd64
          push: true
          # A plain image manifest, without the extra attestation entry (it shows up as "unknown/unknown" on Docker Hub).
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
