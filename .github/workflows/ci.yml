name: Build

# There are no tests yet, so this only checks that the function compiles. Add a test project and a
# `dotnet test` step here when there is one.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Function/Function.csproj

      - name: Build
        run: dotnet build Function/Function.csproj --no-restore --configuration Release
